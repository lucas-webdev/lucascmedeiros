name: Build and Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write futebol API config
        env:
          FUTEBOL_DB_HOST: ${{ secrets.FUTEBOL_DB_HOST }}
          FUTEBOL_DB_NAME: ${{ secrets.FUTEBOL_DB_NAME }}
          FUTEBOL_DB_USER: ${{ secrets.FUTEBOL_DB_USER }}
          FUTEBOL_DB_PASSWORD: ${{ secrets.FUTEBOL_DB_PASSWORD }}
          FUTEBOL_PIN: ${{ secrets.FUTEBOL_PIN }}
        run: |
          cat > public/api/config.php <<PHP
          <?php
          define('DB_HOST', '$FUTEBOL_DB_HOST');
          define('DB_NAME', '$FUTEBOL_DB_NAME');
          define('DB_USER', '$FUTEBOL_DB_USER');
          define('DB_PASS', '$FUTEBOL_DB_PASSWORD');
          define('ADMIN_PIN', '$FUTEBOL_PIN');
          PHP

      - name: Build static export
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy to FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<SCRIPT
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose --parallel=3 ./out/ /httpdocs/
          quit
          SCRIPT
